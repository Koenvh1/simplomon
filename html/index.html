<!doctype html>
<html>

<head>
  <title>Simplomon</title>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'none';" />
  <link rel='stylesheet' href='pico.min.css'>
  <link rel="icon" type="image/x-icon" href="simplomon.ico">
  <script defer src="logic.js"></script>
  <script defer src="alpine.min.js"></script>
</head>

<body>
  <div id="container" x-data="{
all: {},
alerts: [],
version: '?',
showResults: true
}" x-init="doPageLoad($data);setInterval(function() { doPageLoad($data);}, 60000);">
    <header class="container">
      <h1><a href="./">Simplomon</a></h1>
    </header>
    <main class="container">
      <div>
	<h1>Alerts</h1>
	<ul>
          <template x-for="a in alerts">
            <li x-text="a"></li>
          </template>
	</ul>
	<template x-if="alerts.length == 0">
	  <p><b>None! 🥳</b></p>
	</template>
	<h1>Checkers</h1>
	<p style="line-height: 250%;">
	  <template x-for="(cvalue, cindex) in all">
	  <template x-for="a in cvalue">
	    <template x-if="Object.keys(a.reasons).length != 0">
	      <abbr x-bind:title="a.description" style="border-width:4px; border-style: double; border-color:#FF0000; margin-right: 0.5em; margin-top: 0.5em; padding: 0.25em; display: inline-block; font-weight: bold;" x-text="a.name != '' ? a.name : a.description"></abbr>
	    </template>
	  </template>
	</template>

	<template x-for="(cvalue, cindex) in all">
	  <template x-for="a in cvalue">
	    <template x-if="Object.keys(a.reasons).length == 0">
	      <abbr x-bind:title="a.description" style="border-width:2px; border-style:solid; border-color:#4CBB17; margin-right: 0.5em; margin-top: 0.5em; padding: 0.25em; display: inline-block;" x-text="a.name != '' ? a.name : a.description"></abbr>
	    </template>
	  </template>
	</template>

	</p>

	<h1>Checking results</h1>
	<template x-if="showResults">
          <template x-for="(cvalue, cindex) in all">
            <div>
	      <hgroup>
		<h1 x-text="cindex"></h1>
	      </hgroup>
              <table class="striped">
		<thead>
                  <tr>
                    <template x-for="(value, index) in all[cindex].cols">
                      <th x-text="index"></th>
                    </template>
                    <th>Subject</th>
                    <template x-for="(value, index) in all[cindex].rcols">
                      <th x-text="index"></th>
                    </template>
                  </tr>
		</thead>
		<template x-for="a in cvalue">
                  <tbody>
		    <tr><td colspan="40"><em><span x-text="a.description"></span></em> (<b><span x-text="a.name"></span></b>)</td></tr>

                    <tr>
                      <template x-for="(value, index) in all[cindex].cols">
			<td x-text="a['attr'][index]"></td>
                      </template>
                    </tr>
                    <template x-for="(value, index) in a['results']">
                      <tr>
			<template x-for="(value1, index1) in all[cindex].cols">
                          <td></td>
			</template>
			<td x-text="index"></td>
			<template x-for="(value2, index2) in all[cindex].rcols">
                          <td x-text="cleanUpVal(value[index2])"></td>
			</template>
                      </tr>
                    </template>
                  </tbody>>
		</template>
              </table>
            </div>
          </template>
	</template>
      </div>
    </main>
    <footer class="container">
      <small><center>
	  Learn more about Simplomon on <a href="https://codeberg.org/berthubert/simplomon">Codeberg</a> &mdash; version <span x-text="version"></span>
      </center></small>
    </footer>
    
  </div> <!-- id=container -- Alpine div -->
  
</body>

</html>
